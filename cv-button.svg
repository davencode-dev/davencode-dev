<svg width="420" height="64" viewBox="0 0 420 64" xmlns="http://www.w3.org/2000/svg">
            <defs>

                          <!-- Rotating green glow border -->
                          <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                          <stop offset="0%"   stop-color="#444c56"/>
                                          <stop offset="30%"  stop-color="#444c56"/>
                                          <stop offset="50%"  stop-color="#46954a">
                                                            <animate attributeName="stop-color"
                                                                                values="#46954a;#57ab5a;#347d39;#46954a"
                                                                                dur="2.5s" repeatCount="indefinite"/>
                                          </stop>
                                          <stop offset="70%"  stop-color="#444c56"/>
                                          <stop offset="100%" stop-color="#444c56"/>
                                          <animateTransform attributeName="gradientTransform"
                                                            type="translate" from="-1 0" to="1 0"
                                                            dur="2.5s" repeatCount="indefinite"/>
                          </linearGradient>

                          <!-- Green glow blur behind border -->
                          <filter id="greenGlow" x="-4%" y="-25%" width="108%" height="150%">
                                          <feGaussianBlur stdDeviation="2.5" result="blur"/>
                                          <feMerge>
                                                            <feMergeNode in="blur"/>
                                                            <feMergeNode in="SourceGraphic"/>
                                          </feMerge>
                          </filter>

                          <!-- Shimmer sweep -->
                          <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
                                          <stop offset="0%"   stop-color="rgba(205,217,229,0)"/>
                                          <stop offset="42%"  stop-color="rgba(205,217,229,0)"/>
                                          <stop offset="50%"  stop-color="rgba(205,217,229,0.06)"/>
                                          <stop offset="58%"  stop-color="rgba(205,217,229,0)"/>
                                          <stop offset="100%" stop-color="rgba(205,217,229,0)"/>
                                          <animateTransform attributeName="gradientTransform"
                                                            type="translate" from="-2 0" to="2 0"
                                                            dur="2.5s" repeatCount="indefinite"/>
                          </linearGradient>

            </defs>

            <!-- Glow ring -->
            <rect x="1" y="1" width="418" height="62" rx="7" ry="7"
                          fill="none" stroke="url(#borderGrad)" stroke-width="2"
                          filter="url(#greenGlow)" opacity="0.95"/>

            <!-- Card fill: slightly lighter than page bg for contrast -->
            <rect x="2" y="2" width="416" height="60" rx="6" ry="6" fill="#22272e"/>

            <!-- Left green accent bar -->
            <rect x="2" y="2" width="4" height="60" rx="2" ry="2" fill="#347d39">
                          <animate attributeName="fill"
                                          values="#347d39;#46954a;#347d39"
                                          dur="2.5s" repeatCount="indefinite"/>
            </rect>

            <!-- Shimmer overlay -->
            <rect x="2" y="2" width="416" height="60" rx="6" ry="6" fill="url(#shimmer)"/>

            <!-- Centered content group -->
            <!-- icon(20) + gap(12) + text + gap(14) + arrow = ~240px => offset=(420-240)/2=90 -->
            <g transform="translate(90, 0)">

                          <!-- GitHub mark, muted #768390 -->
                          <g transform="translate(0, 22)" fill="#768390">
                                          <path transform="scale(0.833)" d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                          </g>

                          <!-- Main text: bright #cdd9e5 -->
                          <text x="32" y="37"
                                          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                                          font-size="13" font-weight="700" letter-spacing="2.2" fill="#cdd9e5">VIEW INTERACTIVE CV</text>

                          <!-- Arrow: green, bouncing -->
                          <text y="37"
                                          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                                          font-size="15" font-weight="700">
                                          <tspan x="222" fill="#46954a">
                                                            &#x2192;
                                                            <animate attributeName="fill"
                                                                                values="#46954a;#57ab5a;#347d39;#46954a"
                                                                                dur="2.5s" repeatCount="indefinite"/>
                                          </tspan>
                                          <animateTransform attributeName="transform"
                                                            type="translate" values="0 0;4 0;0 0"
                                                            dur="2.5s" repeatCount="indefinite"/>
                          </text>

            </g>
</svg>
