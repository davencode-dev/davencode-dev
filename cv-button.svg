<svg width="420" height="60" viewBox="0 0 420 60" xmlns="http://www.w3.org/2000/svg">
        <defs>
                  <!-- Subtle shimmer sweep -->
                  <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
                              <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
                              <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
                              <stop offset="50%" stop-color="rgba(255,255,255,0.04)"/>
                              <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
                              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                              <animateTransform attributeName="gradientTransform" type="translate" from="-2 0" to="2 0" dur="3s" repeatCount="indefinite"/>
                  </linearGradient>
                  <!-- Animated border: GitHub blue accent pulse -->
                  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                              <stop offset="0%" stop-color="#3d444d"/>
                              <stop offset="50%" stop-color="#4493f8">
                                            <animate attributeName="stop-color" values="#4493f8;#3d444d;#4493f8" dur="3s" repeatCount="indefinite"/>
                                            <animate attributeName="offset" values="0.5;0.5" dur="3s" repeatCount="indefinite"/>
                              </stop>
                              <stop offset="100%" stop-color="#3d444d"/>
                              <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
                  </linearGradient>
                  <filter id="softglow" x="-5%" y="-20%" width="110%" height="140%">
                              <feGaussianBlur stdDeviation="1.5" result="blur"/>
                              <feMerge>
                                            <feMergeNode in="blur"/>
                                            <feMergeNode in="SourceGraphic"/>
                              </feMerge>
                  </filter>
        </defs>

        <!-- Border glow layer (slightly larger, blurred) -->
        <rect x="1" y="1" width="418" height="58" rx="6" ry="6" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#softglow)"/>

        <!-- Main background: GitHub canvas-subtle #2d333b -->
        <rect x="2" y="2" width="416" height="56" rx="5" ry="5" fill="#2d333b"/>

        <!-- Shimmer overlay -->
        <rect x="2" y="2" width="416" height="56" rx="5" ry="5" fill="url(#shimmer)"/>

        <!-- Centered content group: icon(20) + gap(10) + text + gap(10) + arrow(12) -->
        <!-- Text "VIEW INTERACTIVE CV" at 13px bold letter-spacing 1.5 ≈ 178px wide -->
        <!-- Total ≈ 20+10+178+10+12 = 230px → offset = (420-230)/2 = 95 -->
        <g transform="translate(95, 0)">
                  <!-- GitHub mark icon, 20x20, vertically centered (y=20) -->
                  <g transform="translate(0, 20)" fill="#4493f8">
                              <path transform="scale(0.833)" d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                  </g>
                  <!-- Label: GitHub fg-default #d1d7e0 -->
                  <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#d1d7e0">VIEW INTERACTIVE CV</text>
                  <!-- Arrow, accent blue, bouncing -->
                  <text y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#4493f8">
                              <tspan x="218">
                                            →
                                            <animate attributeName="fill" values="#4493f8;#7ab3fa;#4493f8" dur="2s" repeatCount="indefinite"/>
                              </tspan>
                              <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2s" repeatCount="indefinite"/>
                  </text>
        </g>
</svg>
